@'
name: Static Application Security Testing (SAST)

on:
  push:
    branches:
      - main
    paths:
      - "src/week-3/**"
      - ".github/workflows/sast.yml"

  pull_request:
    branches:
      - main
    paths:
      - "src/week-3/**"
      - ".github/workflows/sast.yml"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  bandit-scan:
    name: Bandit Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install Bandit
        run: |
          python -m pip install --upgrade pip
          python -m pip install bandit

      - name: Scan remediated Week 3 application
        run: |
          bandit src/week-3/fixed_app.py
'@ | Set-Content -Encoding utf8 .\.github\workflows\sast.yml